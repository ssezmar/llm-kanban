name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Go vet
        run: cd backend && go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: backend
      - name: Frontend lint & typecheck
        run: cd frontend && npm ci && npx tsc --noEmit

  test-backend:
    name: Test Backend (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run Go tests
        run: cd backend && go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  test-frontend:
    name: Test Frontend
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npx tsc --noEmit

  security-scan:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...
      - name: npm audit
        run: cd frontend && npm ci && npm audit --audit-level=high
        continue-on-error: true

  build-backend:
    name: Build Backend
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build Go binary
        run: cd backend && CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o server .
      - name: Build Docker image
        run: cd backend && docker build -t demo-backend:${{ github.sha }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/server

  build-frontend:
    name: Build Frontend
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        run: cd frontend && npm ci && npm run build
      - name: Check bundle size
        run: |
          SIZE=$(du -sb frontend/dist | cut -f1)
          echo "Bundle size: $((SIZE / 1024)) KB"
          if [ $SIZE -gt 5242880 ]; then
            echo "::warning::Bundle size exceeds 5MB"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-staging:
    name: Deploy Staging
    needs: [build-backend, build-frontend, security-scan]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Backend: demo-backend:${{ github.sha }}"
          echo "Frontend: static files uploaded"

  deploy-prod:
    name: Deploy Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
